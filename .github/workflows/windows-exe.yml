name: Windows portable exe

on:
  push:
    branches: [main, windows-portable-exe]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: uv run pytest

      - name: Build executable
        run: uv run --group build pyinstaller --noconfirm --clean packaging/markitdown-web.spec

      - name: Smoke-test executable
        run: uv run --group build python packaging/smoke_test.py dist/MarkItDown-Web.exe

      - uses: actions/upload-artifact@v6
        with:
          name: MarkItDown-Web-windows
          path: dist/MarkItDown-Web.exe
          if-no-files-found: error
