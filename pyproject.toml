[project]
name = "markitdown-web-local"
version = "1.0.0"
description = "Lightweight local web UI for Microsoft MarkItDown"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]==0.1.7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
    "bleach>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
